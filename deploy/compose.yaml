name: vagasunb-extraordinaria-demo
x-app: &app
  image: vagasunb-extraordinaria:local
  build: {context: .., dockerfile: deploy/Dockerfile}
  init: true
  restart: unless-stopped
  stop_grace_period: 35s
  mem_limit: ${APP_MEMORY:-384m}
  cpus: ${APP_CPUS:-1.0}
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  environment: &env
    VAGAS_MODE: demo
    VAGAS_SECRETS: /run/secrets
    VAGAS_HOST: 127.0.0.1:8765
    VAGAS_CLOUDBEAVER_URL: http://cloudbeaver:8978
    PGHOST: postgres
    PGPASSWORD_FILE: /run/secrets/postgres_password
    VAGAS_HEARTBEAT_DIR: /tmp
  secrets: [keys.json, postgres_password]
  networks: [internal]
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: "4"}
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: vagas
      POSTGRES_DB: vagas_demo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [demo_postgres:/var/lib/postgresql/data]
    networks: [internal]
    mem_limit: ${DB_MEMORY:-512m}
    command: [postgres, -c, max_connections=200, -c, shared_buffers=128MB, -c, work_mem=4MB]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vagas -d vagas_demo"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "4"}
  migrate:
    <<: *app
    restart: "no"
    command: [alembic, -c, config/alembic.ini, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  admin:
    <<: *app
    ports: ["127.0.0.1:8765:8765"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    # Network capability is used only when the operator selects the public source.
    # Demo mode still refuses the real Telegram transport.
    networks: [internal, outgoing]
    command: [python, -m, vagasunb.cli, worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/worker.heartbeat'); assert p.exists() and time.time()-float(p.read_text())<30"]
      interval: 15s
      timeout: 5s
      retries: 5
  bot:
    <<: *app
    profiles: [telegram-future]
    command: [python, -m, vagasunb.cli, bot]
    # Demo mode deliberately refuses this process. Future real instance needs a separate
    # database/project and explicit mode, enable flag, token mount, and outbound network.
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/bot.heartbeat'); assert p.exists() and time.time()-float(p.read_text())<30"]
      interval: 15s
      timeout: 5s
      retries: 5
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    networks: [internal]
    secrets: [postgres_password]
    entrypoint:
      - sh
      - -c
      - |
        export CB_PG_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export CB_ADMIN_NAME="vagas"
        export CB_ADMIN_PASSWORD="$$CB_PG_PASSWORD"
        export CB_SERVER_NAME="VagasUnB DB"
        exec ./run-server.sh
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - demo_cloudbeaver:/opt/cloudbeaver/workspace
      - ./cloudbeaver/.cloudbeaver.runtime.conf:/opt/cloudbeaver/workspace/.data/.cloudbeaver.runtime.conf:ro
      - ./cloudbeaver/demo-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
secrets:
  keys.json: {file: ../.private/secrets/keys.json}
  postgres_password: {file: ../.private/secrets/postgres_password}
volumes:
  demo_postgres:
  demo_cloudbeaver:
networks:
  internal: {internal: true}
  outgoing:
