{
  "folders": {},
  "connections": {
    "vagasunb-demo": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "VagasUnB Demo (PostgreSQL)",
      "save-password": true,
      "read-only": false,
      "configuration": {
        "host": "postgres",
        "port": "5432",
        "database": "vagas_demo",
        "url": "jdbc:postgresql://postgres:5432/vagas_demo",
        "user": "vagas",
        "type": "dev",
        "authModel": "native",
        "auth-properties": {
          "userName": "vagas",
          "userPassword": "${CB_PG_PASSWORD}"
        }
      }
    }
  }
}
